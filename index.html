<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reel Exchange Community - My Posts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 md:p-8">

  <div class="max-w-5xl mx-auto space-y-6">
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-center bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
      <div>
        <h1 class="text-2xl font-bold text-indigo-400"><i class="fa-solid fa-play-circle mr-2"></i>Reel Engagement Exchange</h1>
        <p class="text-sm text-gray-400">ระบบสลับกันกดไลค์กลุ่มสมาชิก (เป้าหมาย 50+ ไลค์/คลิป)</p>
      </div>
      <div class="mt-4 md:mt-0 flex items-center space-x-3">
        <span class="text-sm text-gray-300">รหัสสมาชิกของคุณ:</span>
        <input type="text" id="myMemberId" oninput="fetchPosts()" placeholder="เช่น A001" value="A001" class="bg-gray-700 border border-gray-600 rounded px-3 py-1 font-bold text-indigo-300 uppercase w-24 text-center">
      </div>
    </header>

    <!-- Post Form -->
    <section class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
      <h2 class="text-lg font-semibold mb-4 text-gray-200"><i class="fa-solid fa-plus-circle mr-2"></i>โพสต์ลิ้งค์ Reel ของคุณ</h2>
      <form id="addPostForm" class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div>
          <label class="block text-xs text-gray-400 mb-1">แพลตฟอร์ม</label>
          <select id="platform" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white">
            <option value="FACEBOOK">Facebook Reel</option>
            <option value="INSTAGRAM">Instagram Reel</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">หัวข้อ/ชื่อคลิป</label>
          <input type="text" id="title" placeholder="เช่น คลิปรีวิวสินค้า A" required class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white">
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs text-gray-400 mb-1">ลิ้งค์ Reel (URL)</label>
          <div class="flex space-x-2">
            <input type="url" id="reelUrl" placeholder="https://..." required class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white">
            <button type="submit" id="btnSubmit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2 rounded text-sm transition whitespace-nowrap">
              โพสต์คลิป
            </button>
          </div>
        </div>
      </form>
    </section>

    <!-- 🌟 ส่วนสรุปเฉพาะของฉัน (My Posts Summary) -->
    <section class="bg-gradient-to-r from-gray-800 to-indigo-950 p-6 rounded-xl border border-indigo-500/30 shadow-xl space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-indigo-300">
          <i class="fa-solid fa-user-tag mr-2"></i>สรุปรายการคลิปของฉัน (<span id="displayMyId">A001</span>)
        </h2>
        <span id="myTotalCount" class="text-xs bg-indigo-600/50 text-indigo-200 px-3 py-1 rounded-full font-semibold">0 คลิป</span>
      </div>
      
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-gray-300">
          <thead class="bg-gray-800/80 text-xs uppercase text-gray-400 border-b border-gray-700">
            <tr>
              <th class="p-3">วันที่โพสต์</th>
              <th class="p-3">ชื่อคลิป</th>
              <th class="p-3">แพลตฟอร์ม</th>
              <th class="p-3 text-center">ยอดไลค์ปัจจุบัน</th>
              <th class="p-3 text-right">ลิงก์คลิป</th>
            </tr>
          </thead>
          <tbody id="myPostsTableBody" class="divide-y divide-gray-700/50">
            <!-- Render my posts dynamically -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- Reel Feed & Interaction Status -->
    <section class="space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold text-gray-200">รายการคลิปทั้งหมดในกลุ่ม</h2>
        <button onclick="fetchPosts()" class="text-sm bg-gray-800 hover:bg-gray-700 border border-gray-600 rounded px-3 py-1.5 text-gray-300">
          <i class="fa-solid fa-rotate mr-1"></i>รีเฟรชข้อมูล
        </button>
      </div>

      <div id="postsList" class="space-y-4">
        <!-- Render posts dynamically -->
      </div>
    </section>
  </div>

  <script>
    // ⚠️ วาง Web App URL จาก Google Apps Script ตรงนี้
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx8r8wWVBumrWvu7zuXLOM0ZgrEPAkrFsDmz49UjzGmgX2CYWjPAmmwyFXOTqxePoBoRg/exec";

    document.addEventListener("DOMContentLoaded", fetchPosts);

    // 1. ดึงรายการคลิปทั้งหมด
    async function fetchPosts() {
      const postsContainer = document.getElementById("postsList");
      const myIdInput = document.getElementById("myMemberId").value.trim().toUpperCase();
      document.getElementById("displayMyId").innerText = myIdInput || "---";
      
      postsContainer.innerHTML = `<div class="text-center py-12 text-gray-400"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>กำลังโหลดข้อมูล...</div>`;

      try {
        const res = await fetch(`${SCRIPT_URL}?action=getDashboard`);
        const data = await res.json();
        
        if (data.status === "success") {
          renderDashboard(data.posts, myIdInput);
        }
      } catch (err) {
        postsContainer.innerHTML = `<div class="text-center py-8 text-red-400">กรุณาใส่ SCRIPT_URL ที่ถูกต้องในโค้ด Frontend</div>`;
      }
    }

    // 2. แสดงผลทั้งตารางสรุปของฉัน และ ฟีดรายการทั้งหมด
    function renderDashboard(posts, myId) {
      const postsContainer = document.getElementById("postsList");
      const myTableBody = document.getElementById("myPostsTableBody");
      
      postsContainer.innerHTML = "";
      myTableBody.innerHTML = "";

      // กรองเฉพาะคลิปที่เป็นของฉัน
      const myPosts = posts.filter(post => post.memberId === myId);
      document.getElementById("myTotalCount").innerText = `${myPosts.length} คลิป`;

      if (myPosts.length === 0) {
        myTableBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">คุณยังไม่มีการโพสต์คลิปในระบบ หรือรหัสสมาชิกไม่ตรงกัน</td></tr>`;
      } else {
        myPosts.forEach(post => {
          const formattedDate = new Date(post.timestamp).toLocaleString('th-TH', { 
            dateStyle: 'short', 
            timeStyle: 'short' 
          });
          const row = document.createElement("tr");
          row.className = "hover:bg-gray-800/40 transition";
          row.innerHTML = `
            <td class="p-3 text-xs text-gray-400">${formattedDate}</td>
            <td class="p-3 font-medium text-white">${post.title}</td>
            <td class="p-3"><span class="text-xs px-2 py-0.5 rounded ${post.platform === 'FACEBOOK' ? 'bg-blue-600 text-white' : 'bg-pink-600 text-white'}">${post.platform}</span></td>
            <td class="p-3 text-center"><span class="font-bold text-indigo-300">${post.currentLikes}</span> / ${post.targetLikes}</td>
            <td class="p-3 text-right">
              <a href="${post.reelUrl}" target="_blank" class="text-indigo-400 hover:text-indigo-300 text-xs underline"><i class="fa-solid fa-external-link mr-1"></i>เปิดลิ้งค์</a>
            </td>
          `;
          myTableBody.appendChild(row);
        });
      }

      if (posts.length === 0) {
        postsContainer.innerHTML = `<div class="text-center py-8 text-gray-500">ยังไม่มีคลิปในระบบ โพสต์คลิปแรกของคุณได้เลย!</div>`;
        return;
      }

      // แสดงรายการฟีดทั้งหมดด้านล่าง
      posts.forEach(post => {
        const isLikedByMe = post.likedMembers.includes(myId);
        const progressPercent = Math.min(100, Math.round((post.currentLikes / post.targetLikes) * 100));
        const formattedDate = new Date(post.timestamp).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' });

        let matrixHtml = "";
        for (let i = 1; i <= 80; i++) {
          const mId = "A" + String(i).padStart(3, '0');
          const hasLiked = post.likedMembers.includes(mId);
          matrixHtml += `
            <div class="px-2 py-1 rounded text-xs flex items-center justify-between ${hasLiked ? 'bg-green-900/40 text-green-300 border border-green-700/50' : 'bg-gray-800 text-gray-500 border border-gray-700'}">
              <span>${mId}</span>
              <span>${hasLiked ? '✓' : '-'}</span>
            </div>
          `;
        }

        const card = document.createElement("div");
        card.className = "bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-md space-y-4";
        card.innerHTML = `
          <div class="ไลค์สเตตัส flex flex-col md:flex-row justify-between items-start md:items-center gap-2">
            <div>
              <div class="flex items-center space-x-2">
                <span class="text-xs px-2 py-0.5 rounded font-bold ${post.platform === 'FACEBOOK' ? 'bg-blue-600 text-white' : 'bg-pink-600 text-white'}">${post.platform}</span>
                <span class="text-xs text-gray-400">โพสต์โดย: <strong class="text-indigo-300">${post.memberId}</strong></span>
                <span class="text-xs text-gray-500">• ${formattedDate}</span>
              </div>
              <h3 class="text-lg font-bold text-white mt-1">${post.title}</h3>
            </div>
            <div class="flex items-center space-x-3 w-full md:w-auto">
              <a href="${post.reelUrl}" target="_blank" class="flex-1 md:flex-none text-center bg-gray-700 hover:bg-gray-600 text-indigo-300 px-4 py-2 rounded text-sm transition">
                <i class="fa-solid fa-external-link mr-1"></i>เปิดดูคลิป
              </a>
              <button onclick="toggleLike('${post.postId}')" class="flex-1 md:flex-none px-5 py-2 rounded text-sm font-bold transition ${isLikedByMe ? 'bg-green-600 hover:bg-green-500 text-white' : 'bg-indigo-600 hover:bg-indigo-500 text-white'}">
                ${isLikedByMe ? '<i class="fa-solid fa-check mr-1"></i>กดไลค์แล้ว' : '<i class="fa-solid fa-thumbs-up mr-1"></i>ยืนยันกดไลค์'}
              </button>
            </div>
          </div>

          <div>
            <div class="flex justify-between text-xs text-gray-400 mb-1">
              <span>ความคืบหน้า</span>
              <span>${post.currentLikes} / ${post.targetLikes} ไลค์ (${progressPercent}%)</span>
            </div>
            <div class="w-full bg-gray-700 h-2 rounded-full overflow-hidden">
              <div class="bg-indigo-500 h-full transition-all duration-300" style="width: ${progressPercent}%"></div>
            </div>
          </div>

          <details class="text-xs">
            <summary class="cursor-pointer text-gray-400 hover:text-indigo-400 font-medium py-1">
              <i class="fa-solid fa-list-check mr-1"></i>แสดงสถานะสมาชิกรายคน (A001 - A080)
            </summary>
            <div class="grid grid-cols-4 sm:grid-cols-8 md:grid-cols-10 gap-1.5 mt-3 pt-3 border-t border-gray-700 max-h-48 overflow-y-auto">
              ${matrixHtml}
            </div>
          </details>
        `;
        postsContainer.appendChild(card);
      });
    }

    // 3. บันทึกโพสต์ใหม่
    document.getElementById("addPostForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const myId = document.getElementById("myMemberId").value.trim().toUpperCase();
      const btn = document.getElementById("btnSubmit");
      
      const payload = {
        action: "addPost",
        memberId: myId,
        platform: document.getElementById("platform").value,
        title: document.getElementById("title").value,
        reelUrl: document.getElementById("reelUrl").value,
        targetLikes: 50
      };

      btn.disabled = true;
      btn.innerText = "กำลังบันทึก...";

      await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });

      document.getElementById("title").value = "";
      document.getElementById("reelUrl").value = "";
      btn.disabled = false;
      btn.innerText = "โพสต์คลิป";
      fetchPosts();
    });

    // 4. สลับสถานะกดไลค์
    async function toggleLike(postId) {
      const myId = document.getElementById("myMemberId").value.trim().toUpperCase();
      const payload = {
        action: "toggleLike",
        postId: postId,
        memberId: myId
      };

      await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });

      fetchPosts();
    }
  </script>
</body>
</html>
