<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reel Tracker & Copy Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 md:p-8">

  <div class="max-w-5xl mx-auto space-y-6">
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-center bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
      <div>
        <h1 class="text-2xl font-bold text-indigo-400"><i class="fa-solid fa-square-poll-vertical mr-2"></i>Reel Tracker & Copy Assistant</h1>
        <p class="text-sm text-gray-400">ระบบบันทึกสถิติคลิป Reel และกล่องคัดลอกข้อความสำเร็จรูป</p>
      </div>
      <div class="mt-4 md:mt-0 flex items-center space-x-3">
        <span class="text-sm text-gray-300">รหัสสมาชิก:</span>
        <input type="text" id="myMemberId" onchange="renderMyPosts()" placeholder="เช่น A001" value="A001" class="bg-gray-700 border border-gray-600 rounded px-3 py-1 font-bold text-indigo-300 uppercase w-24 text-center">
      </div>
    </header>

    <!-- Post Form -->
    <section class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
      <h2 class="text-lg font-semibold mb-4 text-gray-200"><i class="fa-solid fa-plus-circle mr-2"></i>โพสต์ลิ้งค์ Reel ใหม่</h2>
      <form id="addPostForm" class="grid grid-cols-1 md:grid-cols-5 gap-4">
        <div>
          <label class="block text-xs text-gray-400 mb-1">แพลตฟอร์ม</label>
          <select id="platform" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white">
            <option value="FACEBOOK">Facebook Reel</option>
            <option value="INSTAGRAM">Instagram Reel</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">หัวข้อ/ชื่อคลิป</label>
          <input type="text" id="title" placeholder="เช่น DAY01 หรือ สินค้า A" required class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">วันที่และเวลาโพสต์</label>
          <input type="datetime-local" id="postDate" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white">
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs text-gray-400 mb-1">ลิ้งค์ Reel (URL)</label>
          <div class="flex space-x-2">
            <input type="url" id="reelUrl" placeholder="https://..." required class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white">
            <button type="submit" id="btnSubmit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-2 rounded text-sm transition whitespace-nowrap">
              โพสต์คลิป
            </button>
          </div>
        </div>
      </form>
    </section>

    <!-- 🌟 กล่องข้อความสำหรับ Copy (Copy Assistant 3 แบบ) -->
    <section class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-indigo-300">
          <i class="fa-solid fa-copy mr-2"></i>กล่องคัดลอกข้อความสำเร็จรูป
        </h2>
        <span class="text-xs text-gray-400">คลิกปุ่มเพื่อคัดลอกข้อความไปใช้งานได้ทันที</span>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- แบบที่ 1: ฝากคลิป -->
        <div class="bg-gray-900 p-4 rounded-lg border border-gray-700 space-y-2 flex flex-col justify-between">
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">แบบที่ 1: ข้อความฝากคลิป</label>
            <textarea id="copyText1" rows="3" class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm text-gray-200 focus:outline-none focus:border-indigo-500" readonly>ฝากดูคลิปใหม่และช่วยดันไลค์/คอมเมนต์ให้หน่อยนะครับ/ค่ะ ขอบคุณครับ 👍🔥</textarea>
          </div>
          <button onclick="copyToClipboard('copyText1', this)" class="w-full bg-gray-700 hover:bg-indigo-600 text-gray-200 hover:text-white py-1.5 rounded text-xs font-semibold transition flex items-center justify-center space-x-1 mt-2">
            <i class="fa-regular fa-copy"></i>
            <span>คัดลอกข้อความ</span>
          </button>
        </div>

        <!-- แบบที่ 2: ฝากติดตาม -->
        <div class="bg-gray-900 p-4 rounded-lg border border-gray-700 space-y-2 flex flex-col justify-between">
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">แบบที่ 2: ฝากติดตาม</label>
            <textarea id="copyText2" rows="3" class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm text-gray-200 focus:outline-none focus:border-indigo-500" readonly>ฝากกดติดตามช่องไว้ด้วยนะครับ/ค่ะ มีคลิปใหม่ๆ อัปเดตให้ชมกันทุกวันแน่นอน ❤️✨</textarea>
          </div>
          <button onclick="copyToClipboard('copyText2', this)" class="w-full bg-gray-700 hover:bg-indigo-600 text-gray-200 hover:text-white py-1.5 rounded text-xs font-semibold transition flex items-center justify-center space-x-1 mt-2">
            <i class="fa-regular fa-copy"></i>
            <span>คัดลอกข้อความ</span>
          </button>
        </div>

        <!-- แบบที่ 3: ขอบคุณ -->
        <div class="bg-gray-900 p-4 rounded-lg border border-gray-700 space-y-2 flex flex-col justify-between">
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">แบบที่ 3: ข้อความขอบคุณ</label>
            <textarea id="copyText3" rows="3" class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm text-gray-200 focus:outline-none focus:border-indigo-500" readonly>ขอบคุณทุกคนที่เข้ามาช่วยกดไลค์ คอมเมนต์ และดันคลิปให้นะครับ/ค่ะ 🙏😊</textarea>
          </div>
          <button onclick="copyToClipboard('copyText3', this)" class="w-full bg-gray-700 hover:bg-indigo-600 text-gray-200 hover:text-white py-1.5 rounded text-xs font-semibold transition flex items-center justify-center space-x-1 mt-2">
            <i class="fa-regular fa-copy"></i>
            <span>คัดลอกข้อความ</span>
          </button>
        </div>
      </div>
    </section>

    <!-- 📊 สรุปรายการคลิปของฉัน + ระบบแก้ไขสถิติและวันที่ -->
    <section class="bg-gradient-to-r from-gray-800 to-indigo-950 p-6 rounded-xl border border-indigo-500/30 shadow-xl space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-indigo-300">
          <i class="fa-solid fa-list-check mr-2"></i>สรุปรายการคลิปของฉัน (<span id="displayMyId">A001</span>)
        </h2>
        <span id="myTotalCount" class="text-xs bg-indigo-600/50 text-indigo-200 px-3 py-1 rounded-full font-semibold">0 คลิป</span>
      </div>
      
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-gray-300">
          <thead class="bg-gray-800/80 text-xs uppercase text-gray-400 border-b border-gray-700">
            <tr>
              <th class="p-3">วันที่โพสต์</th>
              <th class="p-3">ชื่อคลิป</th>
              <th class="p-3">แพลตฟ
